name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      LTO:
        description: 'Link-time Optimizations'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin
          - full
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      DEFCONFIG:
        description: Defconfig
        default: 'touchdirt-a04_defconfig'
        required: true
      CLANG_SIXTEEN:
        description: Use clang 16
        type: boolean
      KSU:
        description: Add bakasu support
        type: boolean
      LLVM:
        description: LLVM=1
        type: boolean
      LLVM_IAS:
        description: LLVM_IAS=1 (LLVM=1 required!)
        type: boolean
      SELINUX_PERMISSIVE:
        description: Set SELinux as Permissive by default
        type: boolean
      MISC_OPT_OVERCLOCK:
        description: Overclock GPU to 800 MHz
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a045
          ref: ${{ inputs.BRANCH }}
          path: kernel_root
          show-progress: false
          fetch-depth: 1

      - name: Prepare dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc cpio flex bison aptitude git python-is-python3 tar perl wget curl lz4 \
            libssl-dev gcc g++ clang libncurses5-dev ccache make zip xz-utils \
            device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi

      - name: Fetch toolchains
        working-directory: kernel_root
        run: |
          mkdir -p toolchains
          cd toolchains
          if [[ "${{ inputs.CLANG_SIXTEEN }}" != "true" ]]; then
            git clone --depth=1 https://gitlab.com/Rissu-Projekt/toolchains/clang-toolchains.git clang-11
          else
            mkdir -p clang-16 && cd clang-16
            wget -q -O clang16.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r475365b.tar.gz
            tar -xf clang16.tar.gz && rm clang16.tar.gz && cd ..
          fi
          git clone --depth=1 https://github.com/VH-Devices/toolchains.git -b gcc-10.3.0 gcc-10

      - name: Setup BakaSU and SUSFS
        working-directory: kernel_root
        run: |
          if [[ "${{ inputs.KSU }}" = "true" ]]; then
            git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU
            chmod +x ./KernelSU/kernel/setup.sh
            ./KernelSU/kernel/setup.sh
          fi

          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd SUSFS
          if [ -f "./SUSFS/Patches/susfs_inline_hook_patches.sh" ]; then
            chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
            ./SUSFS/Patches/susfs_inline_hook_patches.sh
          fi

      - name: Prepare timezone fix
        run: |
          sudo rm -f /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        env:
          KBUILD_BUILD_USER: "${{ github.actor }}"
        run: |
          if [[ "${{ inputs.CLANG_SIXTEEN }}" != "true" ]]; then
            CLANG_VERSION=11
          else
            CLANG_VERSION=16
          fi

          export PATH="$(pwd)/toolchains/clang-${CLANG_VERSION}/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/toolchains/gcc-10/bin/aarch64-buildroot-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export KERNELSU="${{ inputs.KSU }}"
          export KBUILD_BUILD_HOST="rsuntkOrgs"
          export DEFCONFIG="${{ inputs.DEFCONFIG }}"
          export IS_CI=true
          export LTO="${{ inputs.LTO }}"
          export DEVICE="A045F"
          export TARGET_PRODUCT="a04"

          if [[ "${{ inputs.LLVM }}" = "true" ]]; then
            export LLVM=1
          fi
          if [[ "${{ inputs.LLVM_IAS }}" = "true" ]]; then
            export LLVM_IAS=1
          fi

          if [[ "${{ inputs.SELINUX_PERMISSIVE }}" = "true" ]]; then
            if [ -f "arch/arm64/configs/touchdirt-permissive-config" ]; then
              cat "arch/arm64/configs/touchdirt-permissive-config" >> "arch/arm64/configs/${DEFCONFIG}"
            fi
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> "arch/arm64/configs/${DEFCONFIG}"
          fi

          if [[ "${{ inputs.MISC_OPT_OVERCLOCK }}" = "true" ]]; then
            echo "CONFIG_MISC_OPT_OVERCLOCK=y" >> "arch/arm64/configs/${DEFCONFIG}"
          fi

          make -C "$(pwd)" O="$(pwd)/out" ARCH=arm64 "${DEFCONFIG}"

          if [ -f "arch/arm64/configs/touchdirt.config" ]; then
            ./scripts/kconfig/merge_config.sh -O "$(pwd)/out" "$(pwd)/out/.config" arch/arm64/configs/touchdirt.config
          fi

          if [[ "${{ inputs.LTO }}" = "thin" ]]; then
            ./scripts/config --file out/.config -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE
          elif [[ "${{ inputs.LTO }}" = "full" ]]; then
            ./scripts/config --file out/.config -e LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO_NONE
          fi

          make -C "$(pwd)" O="$(pwd)/out" ARCH=arm64 olddefconfig
          make -C "$(pwd)" O="$(pwd)/out" ARCH=arm64 -j"$(nproc --all)"

          gitsha1=$(git rev-parse --short HEAD)
          buildDetails="$(make -s kernelversion)-${DEVICE}_${gitsha1}_$(date +'%Y%m%d%H%M%S')"
          echo "buildDetails=$buildDetails" >> "$GITHUB_OUTPUT"

      - name: Package AnyKernel3
        working-directory: kernel_root
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          git clone https://github.com/Halk56855/AnyKernel3-a04.git -b master --depth 1 AnyKernel3

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "out/arch/arm64/boot/Image.gz-dtb" AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp "out/arch/arm64/boot/Image.gz" AnyKernel3/Image
          else
            cp "out/arch/arm64/boot/Image" AnyKernel3/Image
          fi

          cd AnyKernel3
          zip -r9 "../TouchDirt-${{ steps.buildKernel.outputs.buildDetails }}-${DATE}.zip" . -x ".git/*"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TouchDirt-${{ steps.buildKernel.outputs.buildDetails }}
          path: kernel_root/TouchDirt-*.zip

      - name: Strip LKMs
        working-directory: kernel_root
        run: |
          if [[ "${{ inputs.CLANG_SIXTEEN }}" != "true" ]]; then
            CLANG_VERSION=11
          else
            CLANG_VERSION=16
          fi

          mkdir -p ../kernel_object_tmp kernel_object
          if [ -d "out" ]; then
            find out -type f -name "*.ko" -exec mv -t ../kernel_object_tmp {} +
          fi

          if compgen -G "../kernel_object_tmp/*.ko" > /dev/null; then
            for file in ../kernel_object_tmp/*.ko; do
              "$(pwd)/toolchains/clang-${CLANG_VERSION}/bin/llvm-strip" "$file" --strip-unneeded
            done
            mv ../kernel_object_tmp/*.ko "$(pwd)/kernel_object/"
          fi

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: LKM-${{ steps.buildKernel.outputs.buildDetails }}
          path: kernel_root/kernel_object/*
