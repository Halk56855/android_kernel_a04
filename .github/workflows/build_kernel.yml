name: Build TouchDirt Kernel, BakaSU
on:
  workflow_dispatch:
    inputs:
      LTO:
        description: 'Link-time Optimizations'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin
          - full
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      DEFCONFIG:
        description: Defconfig
        default: 'touchdirt-a04_defconfig'
        required: true
      CLANG_SIXTEEN:
        description: Use clang 16
        type: boolean
      KSU:
        description: Add bakasu support
        type: boolean
      LLVM:
        description: LLVM=1
        type: boolean
      LLVM_IAS:
        description: LLVM_IAS=1 (LLVM=1 required!)
        type: boolean
      SELINUX_PERMISSIVE:
        description: Set SELinux as Permissive by default
        type: boolean
      MISC_OPT_OVERCLOCK:
        description: Overclock GPU to 800 MHz
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a045
          ref: ${{ inputs.BRANCH }}
          fetch-depth: 1

      - name: Integrating BakaSU
        if: ${{ inputs.KSU }}
        run: |
          echo "[-] Cloning BakaSU repo..."
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU

          echo "[-] Setup BakaSU..."
          chmod +x ./KernelSU/kernel/setup.sh
          ./KernelSU/kernel/setup.sh
          rm -rf KernelSU
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU

      - name: SUSFS
        run: |
          git clone https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd --depth 1 SUSFS
          chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
          ./SUSFS/Patches/susfs_inline_hook_patches.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev gcc g++ clang python3 \
            libncurses5-dev ccache make git zip wget xz-utils \
            device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

      - name: Prepare Toolchains directories
        run: |
          mkdir -p toolchain/gcc
          mkdir -p toolchain/clang

      - name: Download GCC & Clang Toolchain
        run: |
          cd toolchain/gcc
          if [[ "${{ inputs.CLANG_SIXTEEN }}" != "true" ]]; then
            wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
              https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
            wget -q --show-progress \
              https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
            tar -xf gcc.tar.xz -C ./

            cd ../clang
            wget -q --show-progress \
              https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
            mkdir -p host/linux-x86/clang-r383902
            tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902
          else
            wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
              https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
            wget -q --show-progress \
              https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
            tar -xf gcc.tar.xz -C ./

            cd ../clang
            mkdir -p host/linux-x86/clang-r475365b && cd host/linux-x86/clang-r475365b
            wget -q -O clang16.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r475365b.tar.gz
            tar -xzf clang16.tar.gz && rm clang16.tar.gz
          fi

      - name: Set Environment Variables
        run: |
          if [[ "${{ inputs.CLANG_SIXTEEN }}" != "true" ]]; then
            CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
          else
            CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r475365b/bin"
          fi
          GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"

          echo "$CLANG_PATH" >> "$GITHUB_PATH"

          echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> "$GITHUB_ENV"
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> "$GITHUB_ENV"

          if [[ "${{ inputs.LLVM }}" = "true" ]]; then
            echo "LLVM=1" >> "$GITHUB_ENV"
          fi
          if [[ "${{ inputs.LLVM_IAS }}" = "true" ]]; then
            echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          fi

      - name: Configure and Compile Kernel
        run: |
          DEFCONFIG_NAME="${{ inputs.DEFCONFIG }}"
          if [[ "$DEFCONFIG_NAME" == *" "* ]] || [ ! -f "arch/arm64/configs/$DEFCONFIG_NAME" ]; then
            DEFCONFIG_NAME="touchdirt-a04_defconfig"
          fi

          if [[ "${{ inputs.SELINUX_PERMISSIVE }}" = "true" ]]; then
            if [ -f "arch/arm64/configs/touchdirt-permissive-config" ]; then
              cat "arch/arm64/configs/touchdirt-permissive-config" >> "arch/arm64/configs/$DEFCONFIG_NAME"
            fi
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> "arch/arm64/configs/$DEFCONFIG_NAME"
          fi

          if [[ "${{ inputs.MISC_OPT_OVERCLOCK }}" = "true" ]]; then
            echo "CONFIG_MISC_OPT_OVERCLOCK=y" >> "arch/arm64/configs/$DEFCONFIG_NAME"
          fi

          make -C "$(pwd)" O="$(pwd)/out" "$DEFCONFIG_NAME"

          if [ -f "arch/arm64/configs/touchdirt.config" ]; then
            ./scripts/kconfig/merge_config.sh -O "$(pwd)/out" "$(pwd)/out/.config" arch/arm64/configs/touchdirt.config
          fi

          if [[ "${{ inputs.LTO }}" = "thin" ]]; then
            ./scripts/config --file out/.config -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE
          elif [[ "${{ inputs.LTO }}" = "full" ]]; then
            ./scripts/config --file out/.config -e LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO_NONE
          fi

          grep '^CONFIG_LOCALVERSION=' out/.config

          sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' "$(pwd)/out/.config"
          sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-TouchDirt-BakaSU-${{ inputs.BRANCH }}\"/" out/.config

          make -C "$(pwd)" O="$(pwd)/out" olddefconfig

          make -C "$(pwd)" O="$(pwd)/out" prepare
          make -C "$(pwd)" O="$(pwd)/out" scripts
          make -C "$(pwd)" O="$(pwd)/out" security/

          make -C "$(pwd)" O="$(pwd)/out" -j"$(nproc)" || make -C "$(pwd)" O="$(pwd)/out" -j1

      - name: Package AnyKernel3
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          git clone https://github.com/Halk56855/AnyKernel3-a04.git -b master --depth 1 AnyKernel3

          cp out/arch/arm64/boot/Image AnyKernel3/Image

          cd AnyKernel3
          zip -r9 "../TouchDirt-BakaSU-${{ inputs.BRANCH }}-${DATE}.zip" . -x ".git/*"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TouchDirt-BakaSU
          path: TouchDirt-*.zip
